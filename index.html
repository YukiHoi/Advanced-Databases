<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movie App (PouchDB)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🎬 Movie App</h1>
    <div>Sync: <span id="status" class="offline">Offline</span></div>
  </header>

  <main>
    <section class="panel">
      <h2 id="form-title">Add Movie</h2>
      <form id="movie-form">
        <input type="hidden" id="movie-id">
        <label>Title <input type="text" id="title" placeholder="e.g. Star Wars" required></label>
        <label>Actors <input type="text" id="actors" placeholder="Comma separated, e.g. Carrie Fisher, Harrison Ford"></label>
        <label>Genres <input type="text" id="genres" placeholder="Comma separated, e.g. Sci-Fi, Adventure"></label>
        <div class="buttons">
          <button type="submit" id="save-btn" class="primary">Save</button>
          <button type="button" id="cancel-btn" hidden>Cancel</button>
        </div>
      </form>
    </section>

    <section>
      <div class="list-header">
        <h2>Movies</h2>
        <input type="text" id="search" placeholder="🔍 Search by title (shows first 50)">
      </div>
      <p id="count"></p>
      <ul id="movie-list"></ul>
    </section>
  </main>

  <!-- PouchDB from CDN. For true offline loading, download it and point this at the local file. -->
  <script src="https://cdn.jsdelivr.net/npm/pouchdb@8.0.1/dist/pouchdb.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
